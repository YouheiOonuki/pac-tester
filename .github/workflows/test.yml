# テストの自動実行（yorozu-craft の README「ツールを追加するとき」）。push と PR のたびに走らせる
# pac-tester.html・pac-tester-en.html はビルドしたものをコミットしているので、ビルドし直して差分が無いことも確かめる
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: pac-tester.html・pac-tester-en.html がソースから作り直したものと同じか
        run: |
          node build.mjs
          git diff --exit-code -- pac-tester.html pac-tester-en.html THIRD_PARTY_LICENSES.txt
          test -z "$(git status --porcelain -- pac-tester-en.html)"
      - run: node --test tests/*.test.js
